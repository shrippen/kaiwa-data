# CI: converter tests on excerpts of the real sources (tests/fixtures).
#
# This same file lives in .gitea/workflows and .github/workflows: Gitea reads the copy in
# .gitea/workflows, GitHub only ever reads .github/workflows. A change here goes into both.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: python3 -m unittest discover -s tests -t . -v
